# ===================================================================
# SecureTrack SL - Application Configuration
# ===================================================================
spring.application.name=securetrack-backend
server.port=8080

# ------------------ MySQL 8.0 Data Layer ------------------
spring.datasource.url=jdbc:mysql://localhost:3306/securetrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------ JWT Configuration ------------------
# 256-bit (32+ char) secret used to sign JWT tokens - override in production via env var
securetrack.jwt.secret=ChangeThisSecretKeyForSecureTrackSLProductionUse1234567890
securetrack.jwt.expiration-ms=86400000
securetrack.jwt.issuer=SecureTrack-SL-Customs

# ------------------ MQTT 5.0 Broker (ESP32 Edge Telemetry) ------------------
securetrack.mqtt.broker-url=tcp://broker.emqx.io:1883
securetrack.mqtt.client-id=securetrack-backend-subscriber
securetrack.mqtt.username=mqtt_user
securetrack.mqtt.password=mqtt_pass
securetrack.mqtt.topic.telemetry=securetrack/container/+/telemetry
securetrack.mqtt.qos=1
securetrack.mqtt.auto-reconnect=true
securetrack.mqtt.connection-timeout=30
securetrack.mqtt.keep-alive-interval=60

# ------------------ Route Verification Tolerance ------------------
# Max allowed deviation (in degrees, approx.) from a geofence corridor point before a deviation alert fires
securetrack.geofence.deviation-threshold=0.01

# ------------------ Logging ------------------
logging.level.root=INFO
logging.level.com.securetrack.backend=DEBUG
logging.level.org.springframework.security=INFO

# Email Configuration (SMTP - උදාහරණයක් ලෙස Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nimanthabandara990@gmail.com
spring.mail.password=rynopfjldnukssmo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio Configuration
twilio.account.sid=your_twilio_account_sid
twilio.auth.token=your_twilio_auth_token
